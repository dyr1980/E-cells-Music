name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'
  JAVA_VERSION: '17'
  NDK_VERSION: '28.2.13676358'

jobs:
  build-apk:
    name: Build ${{ matrix.abi }} release APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - flavor: impeller
            abi: arm64
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - flavor: skia
            abi: arm64
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - flavor: skia
            abi: arm32
            rust-target: armv7-linux-androideabi
            flutter-target: android-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Rust toolchain (${{ matrix.rust-target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: android-${{ matrix.abi }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$STORE_PASSWORD
          EOF
            echo "Using release keystore from secrets."
          else
            echo "RELEASE_KEYSTORE_BASE64/RELEASE_STORE_PASSWORD not set; falling back to debug signing."
          fi

      # 新增步骤：如果是手动触发，生成一个虚拟的版本号，防止后面的脚本报错
      - name: Set Version Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=manual-build-${{ github.run_number }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Build release APK (${{ matrix.abi }}, ${{ matrix.flavor }})
        run: >-
          flutter build apk --release
          --target-platform ${{ matrix.flutter-target }}
          --flavor ${{ matrix.flavor }}
          --dart-define=APP_RENDERER=${{ matrix.flavor }}
          --dart-define=APP_ABI=${{ matrix.abi }}

      - name: Rename APK with flavor and abi
        id: apk
        run: |
          SRC=$(find build -name "app-${{ matrix.flavor }}-release.apk" -print -quit)
          DST="xcz-music-${{ env.TAG_NAME }}-${{ matrix.flavor }}-${{ matrix.abi }}.apk"
          cp "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          ls -lh "$DST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-${{ matrix.abi }}-${{ env.TAG_NAME }}
          path: ${{ steps.apk.outputs.path }}

  publish-release:
    name: Auto Publish to Release
    needs: build-apk
    # 【已修改】：删除了 if 限制条件，打包成功后必定执行发布
    runs-on: ubuntu-latest
    steps:
      - name: Set Version Tag (Again)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=manual-build-${{ github.run_number }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Download impeller arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-impeller-arm64-${{ env.TAG_NAME }}
          path: dist

      - name: Download skia arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-skia-arm64-${{ env.TAG_NAME }}
          path: dist

      - name: Download skia arm32 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-skia-arm32-${{ env.TAG_NAME }}
          path: dist

      - name: Create legacy-named alias APKs (for 1.x clients)
        run: |
          cd dist
          cp "xcz-music-${{ env.TAG_NAME }}-skia-arm64.apk" \
             "xcz-music-arm64-v8a-${{ env.TAG_NAME }}.apk"
          cp "xcz-music-${{ env.TAG_NAME }}-skia-arm32.apk" \
             "xcz-music-armeabi-v7a-${{ env.TAG_NAME }}.apk"
          ls -la

      # 生成单一的 checksums.txt 文件
      - name: Generate checksums.txt
        run: |
          cd dist
          sha256sum xcz-music-*.apk > "xcz-music-${{ env.TAG_NAME }}-checksums.txt"
          echo "Generated checksum file content:"
          cat "xcz-music-${{ env.TAG_NAME }}-checksums.txt"

      # 关键补充步骤：如果 Release 不存在，则自动创建
      - name: Create Release if not exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ env.TAG_NAME }}" -R "$GITHUB_REPOSITORY" || \
          gh release create "${{ env.TAG_NAME }}" -R "$GITHUB_REPOSITORY" \
            --title "Release ${{ env.TAG_NAME }}" \
            --notes "Auto-generated release for ${{ env.TAG_NAME }}" \
            --draft=false

      - name: Upload APKs to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=(
            "dist/xcz-music-${{ env.TAG_NAME }}-impeller-arm64.apk"
            "dist/xcz-music-${{ env.TAG_NAME }}-skia-arm64.apk"
            "dist/xcz-music-${{ env.TAG_NAME }}-skia-arm32.apk"
            "dist/xcz-music-arm64-v8a-${{ env.TAG_NAME }}.apk"
            "dist/xcz-music-armeabi-v7a-${{ env.TAG_NAME }}.apk"
            "dist/xcz-music-${{ env.TAG_NAME }}-checksums.txt"
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          gh release upload "${{ env.TAG_NAME }}" "${files[@]}" \
            -R "$GITHUB_REPOSITORY" --clobber
