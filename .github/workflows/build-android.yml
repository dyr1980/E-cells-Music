name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'
  JAVA_VERSION: '17'
  NDK_VERSION: '28.2.13676358'

jobs:
  build-apk:
    name: Build ${{ matrix.abi }} release APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - flavor: impeller
            abi: arm64
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - flavor: skia
            abi: arm64
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - flavor: skia
            abi: arm32
            rust-target: armv7-linux-androideabi
            flutter-target: android-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Rust toolchain (${{ matrix.rust-target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: android-${{ matrix.abi }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$STORE_PASSWORD
          EOF
            echo "Using release keystore from secrets."
          else
            echo "RELEASE_KEYSTORE_BASE64/RELEASE_STORE_PASSWORD not set; falling back to debug signing."
          fi

      - name: Set Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Build release APK (${{ matrix.abi }}, ${{ matrix.flavor }})
        run: >-
          flutter build apk --release
          --target-platform ${{ matrix.flutter-target }}
          --flavor ${{ matrix.flavor }}
          --dart-define=APP_RENDERER=${{ matrix.flavor }}
          --dart-define=APP_ABI=${{ matrix.abi }}

      - name: Rename APK with flavor and abi
        id: apk
        run: |
          SRC=$(find build -name "app-${{ matrix.flavor }}-release.apk" -print -quit)
          DST="xcz-music-${{ steps.version.outputs.TAG_NAME }}-${{ matrix.flavor }}-${{ matrix.abi }}.apk"
          cp "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          ls -lh "$DST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-${{ matrix.abi }}-${{ steps.version.outputs.TAG_NAME }}
          path: ${{ steps.apk.outputs.path }}

  publish-release:
    name: Auto Publish to Release
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT
          fi
          
      - name: Set Env
        run: echo "TAG_NAME=${{ steps.version.outputs.TAG_NAME }}" >> $GITHUB_ENV

      - name: Download all APKs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 【关键修复】：用 cp 复制，绝对不弄丢原文件
      - name: Create legacy-named alias APKs (for 1.x clients)
        run: |
          cd dist
          cp "xcz-music-${{ env.TAG_NAME }}-skia-arm64.apk" "xcz-music-arm64-v8a-${{ env.TAG_NAME }}.apk" || true
          cp "xcz-music-${{ env.TAG_NAME }}-skia-arm32.apk" "xcz-music-armeabi-v7a-${{ env.TAG_NAME }}.apk" || true
          ls -la

      - name: Generate checksums.txt
        run: |
          cd dist
          sha256sum xcz-music-*.apk > "xcz-music-${{ env.TAG_NAME }}-checksums.txt"
          echo "Generated checksum file content:"
          cat "xcz-music-${{ env.TAG_NAME }}-checksums.txt"

      # 【终极绝杀】：用官方插件上传 dist 目录下的所有文件
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          # 自动在 GitHub 上生成一段简洁的版本变更记录
          generate_release_notes: true
          body: |
            ## 📥 下载指南
            * **主流手机/新车机**：下载 `impeller-arm64.apk`
            * **画面花屏/闪退**：下载 `arm64-v8a.apk`（兼容版）
            * **老旧车机 (32位)**：下载 `armeabi-v7a.apk`
            
            *注：32位老设备请勿下载 impeller 版本。*
          files: |
            dist/*.apk
            dist/*-checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
