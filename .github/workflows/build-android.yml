name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.8'
  JAVA_VERSION: '17'
  NDK_VERSION: '28.2.13676358'

jobs:
  build-apk:
    name: Build ${{ matrix.abi }} release APK (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - flavor: impeller
            abi: arm64
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - flavor: skia
            abi: arm64
            rust-target: aarch64-linux-android
            flutter-target: android-arm64
          - flavor: skia
            abi: arm32
            rust-target: armv7-linux-androideabi
            flutter-target: android-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;${{ env.NDK_VERSION }}'

      - name: Export ANDROID_NDK_HOME
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Setup Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Setup Rust toolchain (${{ matrix.rust-target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: android-${{ matrix.abi }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$STORE_PASSWORD
          EOF
            echo "Using release keystore from secrets."
          else
            echo "RELEASE_KEYSTORE_BASE64/RELEASE_STORE_PASSWORD not set; falling back to debug signing."
          fi

      - name: Build release APK (${{ matrix.abi }}, ${{ matrix.flavor }})
        run: >-
          flutter build apk --release
          --target-platform ${{ matrix.flutter-target }}
          --flavor ${{ matrix.flavor }}
          --dart-define=APP_RENDERER=${{ matrix.flavor }}
          --dart-define=APP_ABI=${{ matrix.abi }}

      - name: Rename APK with flavor and abi
        id: apk
        run: |
          SRC=$(find build -name "app-${{ matrix.flavor }}-release.apk" -print -quit)
          # 修改为 xcz-music 前缀
          DST="xcz-music-${{ github.ref_name }}-${{ matrix.flavor }}-${{ matrix.abi }}.apk"
          cp "$SRC" "$DST"
          echo "path=$DST" >> "$GITHUB_OUTPUT"
          ls -lh "$DST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}-${{ matrix.abi }}-${{ github.ref_name }}
          path: ${{ steps.apk.outputs.path }}

  publish-release:
    name: Attach APKs to Release (impeller-arm64 first)
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download impeller arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-impeller-arm64-${{ github.ref_name }}
          path: dist

      - name: Download skia arm64 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-skia-arm64-${{ github.ref_name }}
          path: dist

      - name: Download skia arm32 APK
        uses: actions/download-artifact@v4
        with:
          name: apk-skia-arm32-${{ github.ref_name }}
          path: dist

      - name: Create legacy-named alias APKs (for 1.x clients)
        run: |
          cd dist
          # 修改为 xcz-music 前缀
          cp "xcz-music-${{ github.ref_name }}-skia-arm64.apk" \
             "xcz-music-arm64-v8a-${{ github.ref_name }}.apk"
          cp "xcz-music-${{ github.ref_name }}-skia-arm32.apk" \
             "xcz-music-armeabi-v7a-${{ github.ref_name }}.apk"
          ls -la

      # 【核心修改点】：生成单一的 checksums.txt 文件
      - name: Generate checksums.txt
        run: |
          cd dist
          # 将所有 apk 的 sha256 校验值写入一个文本文件
          sha256sum xcz-music-*.apk > "xcz-music-${{ github.ref_name }}-checksums.txt"
          echo "Generated checksum file content:"
          cat "xcz-music-${{ github.ref_name }}-checksums.txt"

      - name: Upload APKs to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 注意这里上传的文件列表变了：去掉了单独的 .sha256 文件，加入了统一的 checksums.txt
          files=(
            "dist/xcz-music-${{ github.ref_name }}-impeller-arm64.apk"
            "dist/xcz-music-${{ github.ref_name }}-skia-arm64.apk"
            "dist/xcz-music-${{ github.ref_name }}-skia-arm32.apk"
            "dist/xcz-music-arm64-v8a-${{ github.ref_name }}.apk"
            "dist/xcz-music-armeabi-v7a-${{ github.ref_name }}.apk"
            "dist/xcz-music-${{ github.ref_name }}-checksums.txt"
          )
          for f in "${files[@]}"; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done
          gh release upload "${{ github.ref_name }}" "${files[@]}" \
            -R "$GITHUB_REPOSITORY" --clobber
