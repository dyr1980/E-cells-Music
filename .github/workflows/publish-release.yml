name: Publish Release

on:
  workflow_run:
    workflows: ["Build Android APK"]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: >
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release when the Android build is green
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.workflow_run.head_branch }}"
          sha="${{ github.event.workflow_run.head_sha }}"
          echo "release tag=$tag sha=$sha"

          green=$(gh run list -R "$GITHUB_REPOSITORY" \
            --branch "$tag" --event push --limit 50 \
            --json workflowName,headSha,status,conclusion \
            | jq --arg sha "$sha" \
              '[.[] | select(.headSha == $sha)
                 | select(.workflowName == "Build Android APK")
                 | select(.status == "completed" and .conclusion == "success")]
                | length')
          echo "green builds: ${green}/1"
          if [ "$green" -lt 1 ]; then
            echo "the Android build has not finished yet, do nothing"
            exit 0
          fi

          if [ "$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "$tag is not a draft (already published), do nothing"
            exit 0
          fi

          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false
          echo "published $tag"
